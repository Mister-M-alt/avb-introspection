# Routing front end for the sharded stack (deploy/docker-compose.scale.yml):
# one backend instance per tenant, reached under its own path prefix. The SPA
# detects its base path at runtime, so the prefixes can be renamed freely and
# no rebuild is needed.
#
# Rationale and shard-key choice: docs/CONTAINER.md §7. Hardening rationale
# and the verification checklist: docs/SECURITY.md. For a single-instance
# deployment use deploy/nginx.conf (port 80) or deploy/nginx.production.conf
# (TLS, fill-in placeholders).
#
# THIS IS ROUTING, NOT LOAD BALANCING. Every upstream below holds exactly one
# server, on purpose. Adding a second server to any of these pools breaks the
# deployment: bearer tokens, analysis sessions, presence and WebSocket streams
# all live in the memory of one process, and two processes sharing a data
# volume corrupt it. See docs/CONTAINER.md §1.

map $http_upgrade $connection_upgrade {
    default upgrade;
    ""      close;
}

# First-line flood defence, in front of each app's own token-bucket limiter.
# The shards see real client addresses because the compose file lists this
# proxy's network in AVB_TRUSTED_PROXIES; without that the app-side per-IP
# limits would key on nginx's address. docs/CONTAINER.md §4.
limit_req_zone  $binary_remote_addr zone=avb_api:10m   rate=40r/s;   # per-IP API
limit_req_zone  $binary_remote_addr zone=avb_login:10m rate=1r/s;    # per-IP login
limit_conn_zone $binary_remote_addr zone=avb_conn:10m;               # per-IP conns

# ---- one upstream per shard — exactly one server each ---------------------
upstream avb_acme    { server acme:8342;    keepalive 8; }
upstream avb_globex  { server globex:8342;  keepalive 8; }
upstream avb_initech { server initech:8342; keepalive 8; }

server {
    listen 80;
    server_name _;

    # Must be >= each backend's --max-upload-mb (512 in the compose file).
    client_max_body_size 512m;
    # Stream uploads through rather than buffering them to disk twice. The
    # backend rejects chunked bodies with 501, so never add proxy_buffering
    # tricks that re-encode the request.
    proxy_request_buffering off;

    limit_conn avb_conn 32;
    limit_req  zone=avb_api burst=80 nodelay;
    limit_req_status 429;
    limit_conn_status 429;

    # Static assets only (app.js is ~270 KiB); never compress API JSON (BREACH).
    gzip on;
    gzip_types text/javascript application/javascript text/css image/svg+xml;
    gzip_min_length 1024;
    gzip_vary on;

    # The SPA is fully self-contained, so a strict CSP with no external
    # origins is safe. Do not leak the upstream server token.
    add_header X-Content-Type-Options nosniff            always;
    add_header X-Frame-Options        DENY               always;
    add_header Referrer-Policy        no-referrer        always;
    add_header Content-Security-Policy "default-src 'self'; img-src 'self' data:; style-src 'self' 'unsafe-inline'; connect-src 'self'; frame-ancestors 'none'; base-uri 'self'" always;
    proxy_hide_header X-Powered-By;
    server_tokens off;
    # Relative Location headers: a redirect then keeps whatever host:port the
    # browser used, which matters when the published port is not 80/443
    # (rootless Podman cannot bind those, so e.g. 8080 is common).
    absolute_redirect off;

    # A bare "/" is ambiguous once there is more than one tenant — send it
    # somewhere deliberate rather than defaulting to a shard.
    location = / { return 404; }

    # ---- acme ------------------------------------------------------------
    location = /acme { return 301 /acme/; }

    location = /acme/api/login {
        limit_req zone=avb_login burst=5 nodelay;
        proxy_pass http://avb_acme/api/login;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location = /acme/api/register {
        limit_req zone=avb_login burst=5 nodelay;
        proxy_pass http://avb_acme/api/register;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /acme/api/ws {
        proxy_pass http://avb_acme/api/ws;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 1h;
        proxy_send_timeout 1h;
        proxy_buffering off;
    }

    location /acme/ {
        proxy_pass http://avb_acme/;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 300s;
    }

    # ---- globex ----------------------------------------------------------
    location = /globex { return 301 /globex/; }

    location = /globex/api/login {
        limit_req zone=avb_login burst=5 nodelay;
        proxy_pass http://avb_globex/api/login;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location = /globex/api/register {
        limit_req zone=avb_login burst=5 nodelay;
        proxy_pass http://avb_globex/api/register;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /globex/api/ws {
        proxy_pass http://avb_globex/api/ws;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 1h;
        proxy_send_timeout 1h;
        proxy_buffering off;
    }

    location /globex/ {
        proxy_pass http://avb_globex/;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 300s;
    }

    # ---- initech ---------------------------------------------------------
    location = /initech { return 301 /initech/; }

    location = /initech/api/login {
        limit_req zone=avb_login burst=5 nodelay;
        proxy_pass http://avb_initech/api/login;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location = /initech/api/register {
        limit_req zone=avb_login burst=5 nodelay;
        proxy_pass http://avb_initech/api/register;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /initech/api/ws {
        proxy_pass http://avb_initech/api/ws;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 1h;
        proxy_send_timeout 1h;
        proxy_buffering off;
    }

    location /initech/ {
        proxy_pass http://avb_initech/;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 300s;
    }
}

# ---------------------------------------------------------------------------
# ALTERNATIVE: one subdomain per shard.
#
# Cleaner than path prefixes if you already have wildcard DNS and a wildcard
# certificate, and it keeps each tenant on its own origin (so a cookie or
# localStorage bug can never leak across tenants). One server{} per shard,
# each proxying "/" to its own upstream — no prefix rewriting at all.
#
# server {
#     listen 443 ssl http2;    # not "http2 on;" — unknown to distro nginx < 1.25.1
#     server_name acme.avb.example.com;
#
#     ssl_certificate     /etc/nginx/certs/fullchain.pem;
#     ssl_certificate_key /etc/nginx/certs/privkey.pem;
#     ssl_protocols       TLSv1.2 TLSv1.3;
#     add_header Strict-Transport-Security "max-age=63072000; includeSubDomains" always;
#
#     client_max_body_size 512m;
#     proxy_request_buffering off;
#     limit_conn avb_conn 32;
